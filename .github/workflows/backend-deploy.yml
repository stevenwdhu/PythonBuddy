name: Backend Docker Build and Push

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pythonbuddy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pythonbuddy-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Backend to EC2 via SSM
        id: deploy
        run: |
          # Send deployment command to PRIVATE EC2 instance via Systems Manager
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest pythonbuddy-backend Docker image from GitHub Actions" \
            --parameters 'commands=[
              "echo \"Starting backend deployment process...\"",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pythonbuddy-backend:latest",
              "docker stop pythonbuddy-backend || true",
              "docker rm pythonbuddy-backend || true",
              "docker run -d --name pythonbuddy-backend -p 5000:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/pythonbuddy-backend:latest",
              "echo \"Backend deployment completed successfully!\""
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "command-id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "Deployment command sent with ID: $COMMAND_ID"

      - name: Verify deployment command
        run: |
          echo "Waiting for command to be processed..."
          sleep 5

          # Check command status
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command-id }}" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query '[Status, StatusDetails]' \
            --output text || echo "Command is still in progress. Check AWS Systems Manager Console for details."

          echo "Deployment verification complete. View full details in AWS Systems Manager > Run Command"
